# Proxy reverso HTTPS para o modo web
server {
  listen 443 ssl http2;
  server_name monitor.suaempresa.com.br;
  ssl_certificate     /etc/ssl/monitor.crt;
  ssl_certificate_key /etc/ssl/monitor.key;
  client_max_body_size 200m;
  location /api/v1/eventos/stream {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;          # SSE (tempo real)
    proxy_read_timeout 1h;
  }
  location / {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
