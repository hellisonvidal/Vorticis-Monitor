# Configuração do Monitor de NF-e / NFS-e.
# Copie para config.toml (na mesma pasta do MonitorNotas.exe) e ajuste.
# Caminhos relativos são relativos à pasta do MonitorNotas.exe: a pasta inteira pode ser movida.

[geral]
ambiente = "homologacao"        # "producao" quando validado
banco = "dados/monitor.db"
pasta_xml = "dados/xml"
intervalo_minutos = 60          # mínimo 60 (regra da SEFAZ)
verificar_tls = true            # ou caminho para a cadeia ICP-Brasil (.pem)

[[empresa]]
nome = "Minha Empresa"
cnpj = "00.000.000/0001-00"
uf = "SP"
certificado = "certificados/empresa.pfx"
# Senha do certificado. A interface grava "dpapi:..." automaticamente: a senha fica
# protegida pelo Windows, válida só para este usuário neste computador.
# Também é aceito "env:NOME_DA_VARIAVEL" (lê a senha de uma variável de ambiente).
# senha = "env:SENHA_CERT_EMPRESA"
consultar_nfe = true
consultar_nfse = true
