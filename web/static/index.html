<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vorticis Monitor</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="form-login" class="login-card">
    <img src="logo.png" alt="" class="login-logo">
    <h1>Vorticis Monitor</h1>
    <p class="muted" id="login-sub">Consulta e monitoramento de documentos fiscais</p>
    <div id="setup-campos" class="hidden"><label>Nome<input name="nome"></label></div>
    <label>Usuário<input name="login" required autocomplete="username"></label>
    <label>Senha<input name="senha" type="password" required autocomplete="current-password"></label>
    <div id="lembrar-campos" class="lembrar">
      <label><input type="checkbox" name="lembrar" id="ck-lembrar"> Salvar a senha neste computador</label>
      <label><input type="checkbox" name="auto" id="ck-auto"> Entrar automaticamente ao abrir o programa</label>
      <a id="esquecer" class="hidden">Esquecer a senha salva</a>
    </div>
    <button class="btn primary grande" type="submit" id="btn-login">Entrar</button>
    <p class="erro" id="login-erro"></p>
  </form>
</div>

<div id="app" class="hidden">
  <aside class="side" id="side">
    <div class="brand"><img src="logo.png" alt=""><div><b>Vorticis</b><span>Monitor</span></div></div>
    <nav id="menu"></nav>
    <button class="recolher" id="recolher" title="Recolher menu"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  </aside>
  <div class="principal">
    <header class="top">
      <div><h1 id="titulo">Painel</h1><p class="muted" id="subtitulo"></p></div>
      <div class="top-acoes">
        <div class="emp-sel" id="emp-sel"><button type="button" class="btn" id="emp-btn" title="Empresa (digite o CNPJ ou o nome para pesquisar)"><svg viewBox="0 0 24 24"><path d="M4 21V5l8-3 8 3v16M9 21v-5h6v5"/></svg><span id="emp-rot">Todas as empresas</span><svg viewBox="0 0 24 24" class="seta"><path d="M6 9l6 6 6-6"/></svg></button>
          <div class="emp-pop hidden" id="emp-pop"><input id="emp-busca" placeholder="Pesquisar por CNPJ ou nome…" autocomplete="off" spellcheck="false"><div class="emp-lista" id="emp-lista"></div></div></div>
        <label class="btn" for="upload" title="Importar XML ou ZIP"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 20h16"/></svg> Importar<input id="upload" type="file" multiple accept=".xml,.zip" hidden></label>
        <button class="btn" id="minha-senha" title="Trocar minha senha"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg> <span id="eu-nome"></span></button>
        <span class="status-rt" id="rt" title="Atualização em tempo real"><i></i><span>conectando</span></span>
        <button class="btn icone" id="sair" title="Sair"><svg viewBox="0 0 24 24"><path d="M15 12H4m0 0l4-4m-4 4l4 4M14 4h5a1 1 0 011 1v14a1 1 0 01-1 1h-5"/></svg></button>
      </div>
    </header>
    <div id="banner" class="banner hidden"></div>
    <main id="view"></main>
  </div>
</div>

<div id="selecao" class="selecao hidden">
  <span id="sel-qtd"></span>
  <button class="btn" data-exp="xml">Exportar XML</button>
  <button class="btn" data-exp="pdf">Exportar PDF</button>
  <button class="btn primary" data-exp="ambos">XML + PDF</button>
  <button class="btn ghost" id="sel-limpar">Limpar seleção</button>
</div>
<div id="drawer" class="drawer hidden"><div class="drawer-body" id="drawer-body"></div></div>
<div id="modal" class="modal hidden"><div class="modal-body" id="modal-body"></div></div>
<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
