name: Build e Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Dependências (NSIS)
        run: sudo apt-get update && sudo apt-get install -y nsis zip

      - name: Versão
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(grep -oP 'Versao = "\K[^"]+' internal/api/server.go)"
          fi
          echo "VERSAO=$V" >> "$GITHUB_ENV"
          # Publica Release em tags v* ou, no main, quando a versão do código ainda não tem tag.
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || { [[ "$GITHUB_REF" == refs/heads/main ]] && ! git rev-parse -q --verify "refs/tags/v$V" >/dev/null; }; then
            echo "PUBLICAR=1" >> "$GITHUB_ENV"
          fi
          # Commit com [republicar] no main: move a tag da versão atual e substitui os arquivos da Release.
          if [[ "$GITHUB_REF" == refs/heads/main ]] && git log -1 --pretty=%B | grep -qF '[republicar]'; then
            git tag -f "v$V" && git push -f origin "refs/tags/v$V"
            echo "PUBLICAR=1" >> "$GITHUB_ENV"
          fi

      - name: Testes, compilação e pacotes
        run: ./build.sh

      - name: Artefato — instalador
        uses: actions/upload-artifact@v4
        with:
          name: VorticisMonitor-Instalador-${{ env.VERSAO }}
          path: dist/instalador/

      - name: Artefato — portátil
        uses: actions/upload-artifact@v4
        with:
          name: VorticisMonitor-Portatil-${{ env.VERSAO }}
          path: dist/portatil/

      - name: Publicar Release
        if: env.PUBLICAR == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSAO }}
          target_commitish: ${{ github.sha }}
          name: Vorticis Monitor ${{ env.VERSAO }}
          body: |
            **Escolha uma das versões:**
            - **Instalador** — `VorticisMonitor-Setup-${{ env.VERSAO }}.exe`: instala no computador para o usuário atual (sem administrador), com atalhos e início automático.
            - **Portátil** — `VorticisMonitor-Portatil-${{ env.VERSAO }}.exe`: arquivo único, sem instalação. Coloque numa pasta (ou pendrive) e abra; os dados ficam na pasta `dados` ao lado do arquivo.
            - `SHA256SUMS.txt` — hashes de integridade.

            O programa abre em janela própria do Windows (não usa o navegador). Requisito: Microsoft Edge WebView2 Runtime, já incluído no Windows 10/11 atualizados.
            No primeiro uso, crie o administrador do programa, cadastre a empresa e inclua o certificado digital A1.
          files: |
            dist/instalador/VorticisMonitor-Setup-*.exe
            dist/portatil/VorticisMonitor-Portatil-*.exe
            dist/SHA256SUMS.txt
