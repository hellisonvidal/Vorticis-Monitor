name: Build e Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Dependências (NSIS e zip)
        run: sudo apt-get update && sudo apt-get install -y nsis zip

      - name: Versão
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSAO=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi

      - name: Testes, compilação e pacotes
        run: ./build.sh

      - name: Artefatos da execução
        uses: actions/upload-artifact@v4
        with:
          name: VorticisMonitor-windows
          path: |
            dist/VorticisMonitor.exe
            dist/VorticisMonitor-Portatil-*.zip
            dist/VorticisMonitor-Setup-*.exe
            dist/vorticis-monitor-linux-amd64
            dist/SHA256SUMS.txt

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vorticis Monitor ${{ env.VERSAO }}
          body: |
            **Downloads**
            - `VorticisMonitor-Setup-${{ env.VERSAO }}.exe` — instalador (serviço do Windows)
            - `VorticisMonitor.exe` — executável avulso (duplo clique abre o painel)
            - `VorticisMonitor-Portatil-${{ env.VERSAO }}.zip` — versão portátil (sem instalação)
            - `vorticis-monitor-linux-amd64` — modo servidor web
            - `SHA256SUMS.txt` — hashes de integridade

            Após iniciar, acesse http://localhost:8765, crie o administrador, cadastre a empresa e inclua o certificado digital A1.
          files: |
            dist/VorticisMonitor.exe
            dist/VorticisMonitor-Portatil-*.zip
            dist/VorticisMonitor-Setup-*.exe
            dist/vorticis-monitor-linux-amd64
            dist/SHA256SUMS.txt
