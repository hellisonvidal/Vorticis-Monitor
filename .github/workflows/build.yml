name: Build e Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Dependências (NSIS e zip)
        run: sudo apt-get update && sudo apt-get install -y nsis zip

      - name: Versão
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(grep -oP 'Versao = "\K[^"]+' internal/api/server.go)"
          fi
          echo "VERSAO=$V" >> "$GITHUB_ENV"
          # Publica Release em tags v* ou, no main, quando a versão do código ainda não tem tag.
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || { [[ "$GITHUB_REF" == refs/heads/main ]] && ! git rev-parse -q --verify "refs/tags/v$V" >/dev/null; }; then
            echo "PUBLICAR=1" >> "$GITHUB_ENV"
          fi

      - name: Testes, compilação e pacotes
        run: ./build.sh

      - name: Artefatos da execução
        uses: actions/upload-artifact@v4
        with:
          name: VorticisMonitor-windows
          path: |
            dist/VorticisMonitor.exe
            dist/VorticisMonitor-Portatil-*.zip
            dist/VorticisMonitor-Setup-*.exe
            dist/SHA256SUMS.txt

      - name: Publicar Release
        if: env.PUBLICAR == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSAO }}
          target_commitish: ${{ github.sha }}
          name: Vorticis Monitor ${{ env.VERSAO }}
          body: |
            **Downloads**
            - `VorticisMonitor-Setup-${{ env.VERSAO }}.exe` — instalador (serviço do Windows)
            - `VorticisMonitor.exe` — executável avulso (duplo clique abre o painel)
            - `VorticisMonitor-Portatil-${{ env.VERSAO }}.zip` — versão portátil (sem instalação)
            - `SHA256SUMS.txt` — hashes de integridade

            Após iniciar, acesse http://localhost:8765, crie o administrador, cadastre a empresa e inclua o certificado digital A1.
          files: |
            dist/VorticisMonitor.exe
            dist/VorticisMonitor-Portatil-*.zip
            dist/VorticisMonitor-Setup-*.exe
            dist/SHA256SUMS.txt
